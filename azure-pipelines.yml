trigger:
- main

pool: pool-UAT01

stages:
  - stage:
    jobs:
      - job:
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'UAT01-svc'
            backendAzureRmResourceGroupName: 'rguatstrg1709'
            backendAzureRmStorageAccountName: 'uatstrg1709'
            backendAzureRmContainerName: 'uatcontainer1709'
            backendAzureRmKey: 'uat01.tfstate'

